<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="canonical" href="https://lelyaler.github.io/React-TypeScript/" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>GameVault — Консольный игровой хаб PS5</title>
    <meta name="description" content="Интерактивный каталог видеоигр и трекер бэклога в стиле консоли PlayStation 5." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="./images/backdrops/witcher-3-mobile.webp"
      as="image"
      type="image/webp"
      media="(max-width: 768px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="./images/backdrops/witcher-3.webp"
      as="image"
      type="image/webp"
      media="(min-width: 769px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="./images/capsules/the-witcher-3-wild-hunt.webp"
      as="image"
      type="image/webp"
      media="(min-width: 640px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Space+Grotesk:wght@700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Space+Grotesk:wght@700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Space+Grotesk:wght@700&display=swap"
      />
    </noscript>
  </head>

  <body>
    <div id="root">
      <div class="min-h-screen text-zinc-100 flex flex-col relative selection:bg-white selection:text-black">
        <div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden bg-[#050608]">
          <picture>
            <source media="(max-width: 768px)" srcset="./images/backdrops/witcher-3-mobile.webp" type="image/webp" width="640" height="360" />
            <img src="./images/backdrops/witcher-3.webp" alt="" fetchpriority="high" decoding="async" width="1376" height="768" class="w-full h-full object-cover object-center filter brightness-[0.88] contrast-[1.06] saturate-[1.04]" />
          </picture>
          <div class="absolute inset-0 bg-black/20"></div>
          <div class="absolute inset-0 bg-gradient-to-t from-[#050608] via-[#050608]/75 via-45% to-transparent"></div>
          <div class="absolute inset-0 bg-gradient-to-r from-[#050608]/80 via-[#050608]/35 via-30% to-transparent sm:w-3/5"></div>
          <div class="absolute top-0 inset-x-0 h-32 bg-gradient-to-b from-[#050608]/80 to-transparent"></div>
        </div>

        <header class="sticky top-0 z-30 h-16 sm:h-20 bg-gradient-to-b from-black/85 via-black/40 to-transparent backdrop-blur-xs flex items-center justify-between px-3 sm:px-8 max-w-[1600px] w-full mx-auto select-none">
          <div class="flex items-center gap-2 sm:gap-3">
            <span class="font-extrabold text-lg sm:text-xl tracking-tight text-white leading-none">GameVault</span>
          </div>
        </header>

        <main class="flex-1 flex flex-col lg:justify-between px-3 sm:px-8 max-w-[1600px] w-full mx-auto pb-14">
          <div class="pt-4 sm:pt-14 pb-4 sm:pb-10 max-w-3xl">
            <h1 class="text-2xl sm:text-5xl md:text-6xl font-black text-white tracking-tight leading-tight sm:leading-none drop-shadow-md">
              The Witcher 3: Wild Hunt
            </h1>
            <p class="text-xs sm:text-sm md:text-base text-zinc-300/90 mt-2.5 sm:mt-4 leading-relaxed line-clamp-2 sm:line-clamp-3 font-normal max-w-2xl drop-shadow">
              Культовая ролевая игра от CD PROJEKT RED в мрачном славянском фэнтези. В роли ведьмака Геральта из Ривии найдите Цири — дитя Предназначения, спасаясь от Дикой Охоты в разрушенном войной открытом мире.
            </p>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
